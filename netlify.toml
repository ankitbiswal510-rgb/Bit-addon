[build]
  publish = "public"
  functions = "netlify/functions"

# Route every /api/* request (query string and BitChord-style path params)
# to the stream-provider function.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200
